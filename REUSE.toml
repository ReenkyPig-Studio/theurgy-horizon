version = 1
SPDX-PackageName = "theurgy-horizon"
SPDX-PackageDownloadLocation = "https://github.com/klikli-dev/theurgy"

# Horizon (Rust) port of Theurgy. Third-party exceptions inside content/theurgy
# (Modonomicon theme sprites, NeoForge `c:` tag JSON) are listed in
# THIRD_PARTY_NOTICES.md and content/theurgy/THIRD_PARTY_NOTICES.md.

[[annotations]]
path = "CHANGELOG.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 klikli-dev"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["content/theurgy/assets/**", "content/theurgy/data/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 klikli-dev"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["native/**", "tools/**", "scenarios/**", "differential/**", "oracle/**", "test/**", "docs/**", "content/theurgy/horizon-mod.toml", "README.md", "THIRD_PARTY_NOTICES.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2022 klikli-dev", "2026 Theurgy Horizon port contributors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["artifacts/**", "Cargo.toml", "Cargo.lock", "package.json", "config.example.json", "upstream.lock.json", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Theurgy Horizon port contributors"
SPDX-License-Identifier = "CC0-1.0"
